[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-agent-orchestrator"
version = "0.3.0"
description = "Local-first task orchestration with SQLite, human approvals and Telegram controls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
luna = "luna_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["luna_orchestrator*"]
